<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="School Hub">
<meta name="robots" content="noindex">
<title>School Hub</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
(function(){
  var API = "https://script.google.com/macros/s/AKfycbzQGtKV4lQmDRCNj3lsVqcQ4T4itp-cftw7R9sTcUuC8q43TBd2jBA_c9x65C2jtSlX/exec";
  var CLIENT_ID = "761786683166-0agdbkrpmnlrj2ah43e7o1d0necl6g69.apps.googleusercontent.com";
  var SESSION = 'hub_session', CACHE = 'hub_view';
  window.HUB_STATIC = true;
  function store(){ try { return window.localStorage; } catch (e) { return null; } }
  var ls = store();
  var session = ls ? ls.getItem(SESSION) : null;
  var waiting = [];

  function post(body) {
    return fetch(API, { method: 'POST', body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }
  
  function showLogin() {
    var box = document.getElementById('login');
    if (!box) return;
    box.style.display = 'block';
    (function wait(){
      if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(wait, 200); return; }
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true });
      google.accounts.id.renderButton(document.getElementById('loginBtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with' });
      google.accounts.id.prompt();
    })();
  }
  function onCredential(resp) {
    post({ fn: 'login', idToken: resp.credential }).then(function(j){
      if (!j.ok) throw new Error(j.error === 'auth' ? 'このアカウントでは使えません' : j.error);
      session = j.result.session;
      try { ls.setItem(SESSION, session); } catch (e) {}
      document.getElementById('login').style.display = 'none';
      var w = waiting; waiting = [];
      w.forEach(function(f){ f(); });
    }).catch(function(e){ document.getElementById('loginMsg').textContent = 'ログインできません：' + e.message; });
  }
  function call(fn, args, ok, ng) {
    var fail = function(err){ if (ng) ng(err); else console.error(err); };
    var run = function(){
      post({ session: session, fn: fn, args: args }).then(function(j){
        if (j.ok) {
          if (fn === 'getItems' || fn === 'refreshNow') { try { ls.setItem(CACHE, JSON.stringify(fn === 'refreshNow' ? j.result.items : j.result)); } catch (e) {} }
          if (ok) ok(j.result);
          return;
        }
        if (j.error === 'auth') {
          session = null; try { ls.removeItem(SESSION); } catch (e) {}
          waiting.push(run); showLogin(); return;
        }
        fail(new Error(j.error || 'エラー'));
      }, fail);
    };
    if (!session) { waiting.push(run); showLogin(); return; }
    run();
  }
  function runner(ok, ng) {
    return new Proxy({}, { get: function(_, name){
      if (name === 'withSuccessHandler') return function(f){ return runner(f, ng); };
      if (name === 'withFailureHandler') return function(f){ return runner(ok, f); };
      return function(){ call(name, Array.prototype.slice.call(arguments), ok, ng); };
    }});
  }
  window.google = window.google || {};
  window.google.script = { run: runner() };
  
  window.HUB_CACHED = function(){ try { return JSON.parse(ls.getItem(CACHE)); } catch (e) { return null; } };
  window.HUB_SAVE_CACHE = function(list){ try { ls.setItem(CACHE, JSON.stringify(list)); } catch (e) {} };
})();
</script>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1d1f23; --sub:#6b7079; --line:#e3e5e9; --accent:#2563eb;
          --sakura:#db2777; --codmon:#0d9488; --tetoru:#7c3aed; --unread:#2563eb;
          --cal:#8b6f5a; --todo:#5e7a66; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --card:#1c1f24; --text:#e8eaed; --sub:#9aa0a8; --line:#2c3037; --accent:#60a5fa;
            --sakura:#f472b6; --codmon:#2dd4bf; --tetoru:#a78bfa; --unread:#60a5fa;
            --cal:#b39d8c; --todo:#93ab9a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 -apple-system,"Hiragino Sans",sans-serif;
         padding:12px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { position:relative; display:flex; align-items:center; justify-content:center; min-height:40px; margin-bottom:10px; }
  h1 { font-size:19px; margin:0; text-align:center; }
  #refresh { position:absolute; right:0; top:50%; transform:translateY(-50%); }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; padding:7px 12px; cursor:pointer; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; }
  .tabs button { border-radius:99px; padding:5px 12px; font-size:13px; font-weight:600; white-space:nowrap; }
  .tabs button.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin-bottom:8px; cursor:pointer; }
  .card.unread { border-left:4px solid var(--unread); }
  .card.done .title { color:var(--sub); font-weight:400; }
  .row1 { display:flex; gap:10px; align-items:flex-start; }
  .chk { width:22px; height:22px; margin:2px 0 0; flex:none; accent-color:var(--accent); cursor:pointer; }
  .main { flex:1; min-width:0; }
  .bulkbar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .bulkbar button { font-size:12px; padding:4px 10px; color:var(--sub); }
  #filterBtn { font-size:13px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:4px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #bulk { white-space:nowrap; flex:none; }
  #filterPanel { display:none; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:10px; }
  #filterPanel.on { display:block; }
  .fgroup { margin-bottom:8px; } .fgroup:last-child { margin-bottom:0; }
  .fgroup .fl { font-size:12px; color:var(--sub); margin-bottom:4px; }
  .fgroup .fo { display:flex; flex-wrap:wrap; gap:6px; }
  .fgroup button { border-radius:99px; padding:4px 12px; font-size:13px; }
  .fgroup button.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  .top { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--sub); }
  .badge { font-size:11px; font-weight:700; padding:1px 8px; border-radius:99px; border:1.5px solid currentColor; white-space:nowrap; }
  .src-sakura { color:var(--sakura); } .src-codmon { color:var(--codmon); } .src-tetoru { color:var(--tetoru); }
  .from { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kids { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
  .kid { font-size:11px; font-weight:700; padding:1px 8px; border-radius:99px; background:var(--line); color:var(--text); }
  .ic { width:1.05em; height:1.05em; vertical-align:-0.15em; margin-right:3px; }
  .ptag { font-size:11px; font-weight:600; padding:1px 8px; border-radius:99px; border:1px solid currentColor; }
  .ptag.ev { color:var(--cal); } .ptag.td { color:var(--todo); } .ptag.ok { color:var(--sub); }
  .plans { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  .plans h3 { font-size:13px; margin:0 0 6px; color:var(--sub); display:flex; justify-content:space-between; align-items:center; }
  .plans h3 button { font-size:12px; padding:2px 10px; }
  .plan { border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:6px; display:flex; flex-direction:column; gap:6px; }
  .plan .r { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .plan input { font:inherit; font-size:14px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  .plan input.t { flex:1; min-width:10em; }
  .plan .kind { font-size:12px; font-weight:700; border-radius:99px; padding:3px 10px; }
  .plan .kind.event { color:var(--cal); border-color:var(--cal); } .plan .kind.todo { color:var(--todo); border-color:var(--todo); }
  .plan .reg { margin-left:auto; font-weight:700; background:var(--accent); color:#fff; border-color:var(--accent); }
  .plan .note { font-size:12px; color:var(--sub); }
  .plan.done { opacity:.55; }
  .date { margin-left:auto; white-space:nowrap; }
  .title { font-weight:600; margin-top:4px; }
  .clip { color:var(--sub); font-size:12px; font-weight:400; }
  .body { display:none; white-space:pre-wrap; word-break:break-word; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .card.open .body { display:block; }
  .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .acts a, .acts button { font-size:13px; font-weight:600; border:1.5px solid var(--accent); color:var(--accent); background:none;
                          border-radius:99px; padding:4px 12px; text-decoration:none; }
  .empty { color:var(--sub); text-align:center; padding:24px 0; }
  #msg { color:var(--sub); font-size:13px; min-height:1em; margin-bottom:6px; }
  #newPage { display:none; font-size:13px; margin-bottom:10px; }
  a { color:var(--accent); }
  #fileBar { display:none; position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); gap:8px; align-items:center;
             background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; box-shadow:0 4px 20px rgba(0,0,0,.25); }
  #fileName { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  #fileOpen { font-size:14px; font-weight:700; border:1.5px solid var(--accent); color:var(--accent); background:none;
                         border-radius:99px; padding:5px 14px; text-decoration:none; }
  #fileClose { border:none; background:none; color:var(--sub); padding:4px 6px; }
  #viewer { display:none; position:fixed; inset:0; background:var(--bg); z-index:20; flex-direction:column; }
  #viewer.on { display:flex; }
  .vbar { display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; border-bottom:1px solid var(--line); background:var(--card); }
  #vName { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:600; }
  #vDrive { font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:99px; padding:4px 12px; text-decoration:none; }
  #vClose { border:none; background:none; color:var(--text); font-size:20px; padding:2px 6px; }
  #vPages { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:10px 8px calc(16px + env(safe-area-inset-bottom)); }
  #vPages canvas { display:block; width:100%; height:auto; margin:0 auto 10px; background:#fff; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  #vClose2 { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom)); font-size:13px; font-weight:600;
             padding:6px 16px; border-radius:99px; background:var(--card); color:var(--text); border:1px solid var(--line); box-shadow:0 2px 10px rgba(0,0,0,.3); }
  #vPages { padding-bottom:calc(64px + env(safe-area-inset-bottom)) !important; }
  #vPages .vmsg { color:var(--sub); text-align:center; padding:40px 0; }
  #toast { display:none; position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom)); max-width:calc(100% - 32px);
           background:var(--text); color:var(--bg); border-radius:99px; padding:8px 16px; font-size:13px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.25); z-index:10; }
  #toast.err { background:#b91c1c; color:#fff; border-radius:12px; }
  button:disabled { opacity:.6; }
</style>
</head>
<body>
<header>
  <h1>School Hub<span id="ver" style="font-size:11px;font-weight:400;color:#9aa0a8;margin-left:8px">v4</span></h1>
  <button id="refresh">更新</button>
</header>
<div id="newPage"><a id="newPageLink" target="_blank">スマホ用の画面を開く（Google でログイン・ホーム画面に追加できます）</a></div>
<div class="bulkbar"><button id="filterBtn"></button><button id="bulk">まとめて済</button></div>
<div id="filterPanel"></div>
<div id="login" style="display:none;text-align:center;padding:24px 0">
  <p>はじめに Google でログインしてください（この端末で 1 回だけ）</p>
  <div id="loginBtn" style="display:inline-block"></div>
  <p id="loginMsg" style="color:#dc2626;font-size:13px"></p>
</div>
<div id="msg"></div>
<div id="list"></div>
<div id="viewer">
  <div class="vbar">
    <span id="vName"></span>
    <a id="vDrive" target="_blank" rel="noopener">ドライブで開く</a>
    <button id="vClose" aria-label="閉じる">✕</button>
  </div>
  <div id="vPages"></div>
  <button id="vClose2">✕ 閉じる</button>
</div>
<div id="toast"></div>
<input type="file" id="pdfInput" accept="application/pdf" style="display:none">
<div id="fileBar">
  <span id="fileName"></span>
  <a id="fileOpen" target="_blank" rel="noopener">開く（ドライブ）</a>
  <button id="fileClose" aria-label="閉じる">✕</button>
</div>
<script>
const $ = s => document.querySelector(s);
const SRC = { sakura: 'さくらdays', codmon: 'コドモン', tetoru: 'tetoru' };

const ICON = (d) => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const IC = {
  cal: ICON('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  todo: ICON('<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/>'),
  file: ICON('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'),
  add: ICON('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>'),
  clip: ICON('<path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/>')
};
let items = [];

let filt = { read: 'all', src: 'all', kid: 'all' };
try { Object.assign(filt, JSON.parse(localStorage.getItem('hub_filter') || '{}')); } catch (e) {}
const opened = new Set();

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function linkify(s) { return esc(s).replace(/https?:\/\/[^\s<]+/g, u => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'); }

function shownItems() {
  return items.filter(it => (filt.read === 'all' || !it.read) && (filt.src === 'all' || it.source === filt.src)
    && (filt.kid === 'all' || (it.kids || []).includes(filt.kid)));
}


function renderFilter() {
  const kids = [];
  items.forEach(it => (it.kids || []).forEach(k => { if (!kids.includes(k)) kids.push(k); }));
  if (filt.kid !== 'all' && !kids.includes(filt.kid) && items.length) filt.kid = 'all';
  const unread = items.filter(it => !it.read).length;
  const parts = [filt.read === 'open' ? '未チェックのみ' : 'すべて'];
  if (filt.src !== 'all') parts.push(SRC[filt.src]);
  if (filt.kid !== 'all') parts.push(filt.kid);
  $('#filterBtn').innerHTML = ICON('<path d="M3 5h18M6 12h12M10 19h4"/>') + esc(parts.join('・')) + (unread ? ' <span style="color:var(--sub);font-weight:400">' + unread + '</span>' : '');
  const g = (label, key, opts) => '<div class="fgroup"><div class="fl">' + label + '</div><div class="fo">' +
    opts.map(([v, t]) => '<button data-k="' + key + '" data-v="' + esc(v) + '"' + (filt[key] === v ? ' class="on"' : '') + '>' + esc(t) + '</button>').join('') + '</div></div>';
  $('#filterPanel').innerHTML =
    g('表示', 'read', [['all', 'すべて'], ['open', '未チェックのみ']]) +
    g('連絡元', 'src', [['all', 'すべて'], ['sakura', 'さくらdays'], ['codmon', 'コドモン'], ['tetoru', 'tetoru']]) +
    (kids.length ? g('子ども', 'kid', [['all', 'すべて']].concat(kids.map(k => [k, k]))) : '');
}

function render(list) {
  if (list) items = list;
  const shown = shownItems();
  $('#list').innerHTML = shown.length ? shown.map(card).join('') : '<div class="empty">連絡はありません</div>';
  renderFilter();
  $('#bulk').style.visibility = shown.some(it => !it.read) ? 'visible' : 'hidden';
}

function card(it) {
  const files = it.files || [], links = it.links || [];
  
  const acts = files.map((f, i) => '<button data-file="' + i + '">' + IC.file + esc(f.name) + '</button>')
    .concat(links.map(l => '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.name) + '</a>'))
    .concat(['<button data-addpdf="1">' + IC.add + 'PDF を追加</button>']);
  return '<div class="card' + (it.read ? ' done' : ' unread') + (opened.has(it.id) ? ' open' : '') + '" data-id="' + esc(it.id) + '">' +
    '<div class="row1"><input type="checkbox" class="chk" title="済にする"' + (it.read ? ' checked' : '') + '><div class="main">' +
    '<div class="top"><span class="badge src-' + esc(it.source) + '">' + esc(SRC[it.source] || it.source) + '</span>' +
    '<span class="from">' + esc(it.from) + '</span><span class="date">' + esc(it.date) + '</span></div>' +
    '<div class="title">' + esc(it.title) + (files.length ? ' <span class="clip">' + IC.clip + files.length + '</span>' : '') + '</div>' +
    '<div class="kids">' + (it.kids || []).map(k => '<span class="kid">' + esc(k) + '</span>').join('') + planTags(it) + '</div>' +
    '</div></div>' +
    '<div class="body">' + linkify(it.body) + (acts.length ? '<div class="acts">' + acts.join('') + '</div>' : '') + plansHtml(it) + '</div></div>';
}


function planTags(it) {
  const items = (it.plan && it.plan.items) || [], reg = it.registered || {};
  const left = items.map((p, i) => ({ p, i })).filter(x => !reg[x.i]);
  const ev = left.filter(x => x.p.kind === 'event').length, td = left.filter(x => x.p.kind === 'todo').length;
  if (ev || td) return (ev ? '<span class="ptag ev">' + IC.cal + 'Calendar ' + ev + '</span>' : '') + (td ? '<span class="ptag td">' + IC.todo + 'Todo ' + td + '</span>' : '');
  return items.length ? '<span class="ptag ok">登録済み</span>' : '';
}


function plansHtml(it) {
  const items = (it.plan && it.plan.items) || [], reg = it.registered || {};
  const head = '<h3>Calendar・Todo の候補<button data-replan="1">' + (it.plan && !it.plan.skipped ? 'AI で読み直す' : 'AI で読む') + '</button></h3>';
  if (!it.plan || it.plan.skipped) return '<div class="plans">' + head + '<div class="note">' + (it.plan ? '古い連絡なので読んでいません' : 'まだ読んでいません（30 分以内に自動で読みます）') + '</div></div>';
  if (!items.length) return '<div class="plans">' + head + '<div class="note">登録が必要なものは見つかりませんでした</div></div>';
  return '<div class="plans">' + head + items.map((p, i) => '<div class="plan' + (reg[i] ? ' done' : '') + '" data-plan="' + i + '">' +
    '<div class="r"><button class="kind ' + esc(p.kind) + '" data-kind="' + esc(p.kind) + '">' + (p.kind === 'event' ? IC.cal + 'Calendar（FAMILY）' : IC.todo + 'Todo（SCHOOL）') + '</button>' +
    (reg[i] ? '<span class="note">登録済み</span>' : '<button class="reg">登録</button>') + '</div>' +
    '<div class="r"><input class="t" value="' + esc(p.title) + '"></div>' +
    '<div class="r"><input class="d" type="date" value="' + esc(p.date) + '">' +
    '<input class="s" type="time" value="' + esc(p.start) + '"' + (p.kind === 'todo' ? ' style="display:none"' : '') + '>' +
    '<input class="e" type="time" value="' + esc(p.end) + '"' + (p.kind === 'todo' ? ' style="display:none"' : '') + '></div>' +
    (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') + '</div>').join('') + '</div>';
}


function setRead(ids, read) {
  items.forEach(it => { if (ids.includes(it.id)) it.read = read; });
  render();
  if (window.HUB_SAVE_CACHE) window.HUB_SAVE_CACHE(items);
  google.script.run.withFailureHandler(e => toast('記録できませんでした：' + e.message, 'err')).setRead(ids, read);
}


function showLinked() {
  const m = location.hash.match(/item=([^&]+)/);
  if (!m) return;
  const id = decodeURIComponent(m[1]);
  if (!items.some(it => it.id === id)) return;
  filt = { read: 'all', src: 'all', kid: 'all' };
  opened.add(id);
  render();
  const el = document.querySelector('.card[data-id="' + CSS.escape(id) + '"]');
  if (el) el.scrollIntoView({ block: 'start' });
}
window.addEventListener('hashchange', showLinked);


let toastTimer = null;
function toast(text, kind, ms) {
  const t = $('#toast');
  clearTimeout(toastTimer);
  if (!text) { t.style.display = 'none'; return; }
  t.textContent = text; t.className = kind === 'err' ? 'err' : ''; t.style.display = 'block';
  if (ms !== 0) toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms || (kind === 'err' ? 8000 : 3000));
}

function load(fn) {
  const refresh = fn === 'refreshNow';
  if (refresh) { toast('取り込み中…', '', 0); $('#refresh').disabled = true; $('#refresh').textContent = '更新中…'; }
  else $('#msg').textContent = '読み込み中…';
  const done = () => { $('#msg').textContent = ''; $('#refresh').disabled = false; $('#refresh').textContent = '更新'; };
  google.script.run.withSuccessHandler(res => {
    done();
    if (refresh) {
      render(res.items);
      toast(res.errors && res.errors.length ? '一部取り込めませんでした：' + res.errors[0] : (res.added ? '新しい連絡 ' + res.added + ' 件' : '新しい連絡はありません'), res.errors && res.errors.length ? 'err' : '');
    } else render(res);
    showLinked();
  }).withFailureHandler(e => { done(); toast('エラー：' + e.message, 'err'); })[fn]();
}


document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="https://"]');
  if (!a || !(navigator.standalone || matchMedia('(display-mode: standalone)').matches)) return;
  if (!/iPhone|iPad/.test(navigator.userAgent)) return;
  e.preventDefault();
  location.href = 'x-safari-' + a.href;
}, true);


function openFile(id, index, btn) {
  $('#fileBar').style.display = 'none';
  toast('PDF を準備中…', '', 0);
  if (btn) btn.disabled = true;
  google.script.run.withSuccessHandler(f => {
    toast('');
    if (btn) btn.disabled = false;
    
    const it = items.find(x => x.id === id);
    if (it && it.files[index]) { it.files[index].url = f.url; render(); }
    $('#fileName').textContent = f.name;
    $('#fileOpen').href = f.url;
    $('#fileBar').style.display = 'flex';
  }).withFailureHandler(e => { if (btn) btn.disabled = false; toast('PDF を開けませんでした：' + e.message, 'err'); }).getFile(id, index);
}


let pdfjsLoading = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfjsLoading) pdfjsLoading = new Promise((ok, ng) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(pdfjsLib); };
    sc.onerror = () => { pdfjsLoading = null; ng(new Error('PDF を表示する部品を読み込めませんでした')); };
    document.head.appendChild(sc);
  });
  return pdfjsLoading;
}
let viewerToken = 0;
function openViewer(id, index) {
  const it = items.find(x => x.id === id), f = it && it.files[index];
  const token = ++viewerToken;
  $('#vName').textContent = f ? f.name : 'PDF';
  $('#vDrive').style.display = f && f.url ? '' : 'none';
  if (f && f.url) $('#vDrive').href = f.url;
  $('#vPages').innerHTML = '<div class="vmsg">PDF を読み込んでいます…</div>';
  $('#viewer').classList.add('on');
  document.body.style.overflow = 'hidden';
  Promise.all([loadPdfJs(), new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng).getPdfData(id, index))])
    .then(([lib, d]) => {
      if (token !== viewerToken) return;
      if (f) f.url = d.url;
      $('#vDrive').href = d.url; $('#vDrive').style.display = '';
      const bin = atob(d.b64), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      return lib.getDocument({ data: buf }).promise.then(async pdf => {
        $('#vPages').innerHTML = '';
        const w = $('#vPages').clientWidth - 16, ratio = Math.min(window.devicePixelRatio || 1, 2);
        for (let p = 1; p <= pdf.numPages; p++) {
          if (token !== viewerToken) return;
          const page = await pdf.getPage(p);
          const base = page.getViewport({ scale: 1 });
          const vp = page.getViewport({ scale: (w / base.width) * ratio });
          const cv = document.createElement('canvas');
          cv.width = vp.width; cv.height = vp.height;
          $('#vPages').appendChild(cv);
          await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        }
      });
    })
    .catch(err => { if (token === viewerToken) $('#vPages').innerHTML = '<div class="vmsg">PDF を表示できませんでした：' + esc(err.message) + '<br>「ドライブで開く」から開けます</div>'; });
}
function closeViewer() {
  viewerToken++;
  $('#viewer').classList.remove('on');
  document.body.style.overflow = '';
  $('#vPages').innerHTML = '';
}
$('#vClose').addEventListener('click', closeViewer);
$('#vClose2').addEventListener('click', closeViewer);

$('#filterBtn').addEventListener('click', () => $('#filterPanel').classList.toggle('on'));
$('#filterPanel').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  filt[b.dataset.k] = b.dataset.v;
  try { localStorage.setItem('hub_filter', JSON.stringify(filt)); } catch (err) {}
  render();
});

$('#list').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  const id = c.dataset.id;
  if (e.target.classList.contains('chk')) { setRead([id], e.target.checked); return; }
  const fb = e.target.closest('[data-file]');
  if (fb) { openViewer(id, Number(fb.dataset.file)); return; }
  const it = items.find(x => x.id === id);
  if (e.target.closest('[data-addpdf]')) { addPdfFor = id; $('#pdfInput').value = ''; $('#pdfInput').click(); return; }
  if (e.target.closest('[data-replan]')) {
    toast('AI で読んでいます…（1 分ほど）', '', 0);
    google.script.run.withSuccessHandler(plan => { toast('読み終わりました'); it.plan = plan; it.registered = {}; render(); })
      .withFailureHandler(err => toast(/上限/.test(err.message) ? err.message : '読めませんでした：' + err.message, 'err')).replan(id);
    return;
  }
  const pl = e.target.closest('.plan');
  if (pl) {
    const i = Number(pl.dataset.plan), p = it.plan.items[i];
    const kb = e.target.closest('.kind');
    if (kb) {
      
      Object.assign(p, { title: pl.querySelector('.t').value, date: pl.querySelector('.d').value, start: pl.querySelector('.s').value, end: pl.querySelector('.e').value });
      p.kind = p.kind === 'event' ? 'todo' : 'event'; render(); return;
    }
    if (e.target.closest('.reg')) {
      const q = { kind: p.kind, title: pl.querySelector('.t').value.trim(), date: pl.querySelector('.d').value,
        start: pl.querySelector('.s').value, end: pl.querySelector('.e').value, note: p.note };
      if (!q.title) { toast('題名を入れてください', 'err'); return; }
      if (q.kind === 'event' && !q.date) { toast('Calendar の日付を入れてください', 'err'); return; }
      Object.assign(p, q);
      const rb = e.target.closest('.reg');
      rb.disabled = true; rb.textContent = '登録中…';
      toast('登録中…', '', 0);
      google.script.run.withSuccessHandler(reg => { toast((q.kind === 'event' ? 'Calendar（FAMILY）' : 'Todo（SCHOOL）') + ' に登録しました'); it.registered = reg; render(); })
        .withFailureHandler(err => { rb.disabled = false; rb.textContent = '登録'; toast('登録できませんでした：' + err.message, 'err'); }).registerPlan(id, i, q);
    }
    return;
  }
  if (e.target.closest('a')) return;
  if (opened.has(id)) opened.delete(id); else opened.add(id);
  c.classList.toggle('open');
});

$('#bulk').addEventListener('click', () => {
  const ids = shownItems().filter(it => !it.read).map(it => it.id);
  if (ids.length) setRead(ids, true);
});

$('#refresh').addEventListener('click', () => load('refreshNow'));

let addPdfFor = null;
$('#pdfInput').addEventListener('change', () => {
  const file = $('#pdfInput').files[0], id = addPdfFor;
  if (!file || !id) return;
  if (file.size > 20e6) { toast('PDF が大きすぎます（20MB まで）', 'err'); return; }
  toast('PDF を保存して、AI で読み直しています…（1 分ほど）', '', 0);
  const reader = new FileReader();
  reader.onload = () => {
    const b64 = String(reader.result).split(',')[1];
    google.script.run.withSuccessHandler(res => {
      const it = items.find(x => x.id === id);
      if (it) { it.files = res.files; if (res.plan) it.plan = res.plan; }
      opened.add(id); render();
      if (res.warn) { if (it) it.plan = null; render(); toast('PDF を追加しました。' + res.warn, 'err'); }
      else toast('PDF を追加しました' + (res.plan ? '（候補を作り直しました）' : ''));
    }).withFailureHandler(err => toast('PDF を追加できませんでした：' + err.message, 'err')).addPdf(id, file.name, b64);
  };
  reader.onerror = () => toast('PDF を読み込めませんでした', 'err');
  reader.readAsDataURL(file);
});
$('#fileClose').addEventListener('click', () => { $('#fileBar').style.display = 'none'; });

{ const c = window.HUB_CACHED && window.HUB_CACHED(); if (c) render(c); }
load('getItems');

if (!window.HUB_STATIC) google.script.run.withSuccessHandler(u => { $('#newPageLink').href = u; $('#newPage').style.display = 'block'; }).getNewPageUrl();

      var m = t.match(/id="ver"[^>]*>([^<]+)</);
      if (m && m[1] !== VER) location.reload();
    }).catch(function(){});
  }
  check();
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') check(); });
})();
