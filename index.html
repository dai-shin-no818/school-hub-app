<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="連絡まとめ">
<meta name="robots" content="noindex">
<title>学校の連絡まとめ</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
(function(){
  var API = "https://script.google.com/macros/s/AKfycbzQGtKV4lQmDRCNj3lsVqcQ4T4itp-cftw7R9sTcUuC8q43TBd2jBA_c9x65C2jtSlX/exec";
  var CLIENT_ID = "761786683166-0agdbkrpmnlrj2ah43e7o1d0necl6g69.apps.googleusercontent.com";
  var SESSION = 'hub_session', CACHE = 'hub_view';
  window.HUB_STATIC = true;
  function store(){ try { return window.localStorage; } catch (e) { return null; } }
  var ls = store();
  var session = ls ? ls.getItem(SESSION) : null;
  var waiting = [];

  function post(body) {
    return fetch(API, { method: 'POST', body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }
  
  function showLogin() {
    var box = document.getElementById('login');
    if (!box) return;
    box.style.display = 'block';
    (function wait(){
      if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(wait, 200); return; }
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true });
      google.accounts.id.renderButton(document.getElementById('loginBtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with' });
      google.accounts.id.prompt();
    })();
  }
  function onCredential(resp) {
    post({ fn: 'login', idToken: resp.credential }).then(function(j){
      if (!j.ok) throw new Error(j.error === 'auth' ? 'このアカウントでは使えません' : j.error);
      session = j.result.session;
      try { ls.setItem(SESSION, session); } catch (e) {}
      document.getElementById('login').style.display = 'none';
      var w = waiting; waiting = [];
      w.forEach(function(f){ f(); });
    }).catch(function(e){ document.getElementById('loginMsg').textContent = 'ログインできません：' + e.message; });
  }
  function call(fn, args, ok, ng) {
    var fail = function(err){ if (ng) ng(err); else console.error(err); };
    var run = function(){
      post({ session: session, fn: fn, args: args }).then(function(j){
        if (j.ok) {
          if (fn === 'getItems' || fn === 'refreshNow') { try { ls.setItem(CACHE, JSON.stringify(j.result)); } catch (e) {} }
          if (ok) ok(j.result);
          return;
        }
        if (j.error === 'auth') {
          session = null; try { ls.removeItem(SESSION); } catch (e) {}
          waiting.push(run); showLogin(); return;
        }
        fail(new Error(j.error || 'エラー'));
      }, fail);
    };
    if (!session) { waiting.push(run); showLogin(); return; }
    run();
  }
  function runner(ok, ng) {
    return new Proxy({}, { get: function(_, name){
      if (name === 'withSuccessHandler') return function(f){ return runner(f, ng); };
      if (name === 'withFailureHandler') return function(f){ return runner(ok, f); };
      return function(){ call(name, Array.prototype.slice.call(arguments), ok, ng); };
    }});
  }
  window.google = window.google || {};
  window.google.script = { run: runner() };
  
  window.HUB_CACHED = function(){ try { return JSON.parse(ls.getItem(CACHE)); } catch (e) { return null; } };
})();
</script>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1d1f23; --sub:#6b7079; --line:#e3e5e9; --accent:#2563eb;
          --sakura:#db2777; --codmon:#0d9488; --tetoru:#7c3aed; --unread:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --card:#1c1f24; --text:#e8eaed; --sub:#9aa0a8; --line:#2c3037; --accent:#60a5fa;
            --sakura:#f472b6; --codmon:#2dd4bf; --tetoru:#a78bfa; --unread:#60a5fa; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 -apple-system,"Hiragino Sans",sans-serif;
         padding:12px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  h1 { font-size:19px; margin:0; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; padding:7px 12px; cursor:pointer; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; }
  .tabs button { border-radius:99px; padding:5px 12px; font-size:13px; font-weight:600; white-space:nowrap; }
  .tabs button.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin-bottom:8px; cursor:pointer; }
  .card.unread { border-left:4px solid var(--unread); }
  .card.done .title { color:var(--sub); font-weight:400; }
  .row1 { display:flex; gap:10px; align-items:flex-start; }
  .chk { width:22px; height:22px; margin:2px 0 0; flex:none; accent-color:var(--accent); cursor:pointer; }
  .main { flex:1; min-width:0; }
  .bulkbar { display:flex; justify-content:flex-end; margin-bottom:8px; }
  .bulkbar button { font-size:12px; padding:4px 10px; color:var(--sub); }
  .top { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--sub); }
  .badge { font-size:11px; font-weight:700; padding:1px 8px; border-radius:99px; border:1.5px solid currentColor; white-space:nowrap; }
  .src-sakura { color:var(--sakura); } .src-codmon { color:var(--codmon); } .src-tetoru { color:var(--tetoru); }
  .from { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kids { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
  .kid { font-size:11px; font-weight:700; padding:1px 8px; border-radius:99px; background:var(--line); color:var(--text); }
  #kidTabs:empty { display:none; }
  .ptag { font-size:11px; font-weight:700; padding:1px 8px; border-radius:99px; border:1.5px solid currentColor; }
  .ptag.ev { color:#ea580c; } .ptag.td { color:#16a34a; } .ptag.ok { color:var(--sub); }
  .plans { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  .plans h3 { font-size:13px; margin:0 0 6px; color:var(--sub); display:flex; justify-content:space-between; align-items:center; }
  .plans h3 button { font-size:12px; padding:2px 10px; }
  .plan { border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:6px; display:flex; flex-direction:column; gap:6px; }
  .plan .r { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .plan input { font:inherit; font-size:14px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  .plan input.t { flex:1; min-width:10em; }
  .plan .kind { font-size:12px; font-weight:700; border-radius:99px; padding:3px 10px; }
  .plan .kind.event { color:#ea580c; border-color:#ea580c; } .plan .kind.todo { color:#16a34a; border-color:#16a34a; }
  .plan .reg { margin-left:auto; font-weight:700; background:var(--accent); color:#fff; border-color:var(--accent); }
  .plan .note { font-size:12px; color:var(--sub); }
  .plan.done { opacity:.55; }
  .date { margin-left:auto; white-space:nowrap; }
  .title { font-weight:600; margin-top:4px; }
  .clip { color:var(--sub); font-size:12px; font-weight:400; }
  .body { display:none; white-space:pre-wrap; word-break:break-word; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .card.open .body { display:block; }
  .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .acts a, .acts button { font-size:13px; font-weight:600; border:1.5px solid var(--accent); color:var(--accent); background:none;
                          border-radius:99px; padding:4px 12px; text-decoration:none; }
  .empty { color:var(--sub); text-align:center; padding:24px 0; }
  #msg { color:var(--sub); font-size:13px; min-height:1em; margin-bottom:6px; }
  #newPage { display:none; font-size:13px; margin-bottom:10px; }
  a { color:var(--accent); }
  #fileBar { display:none; position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); gap:8px; align-items:center;
             background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; box-shadow:0 4px 20px rgba(0,0,0,.25); }
  #fileName { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  #fileOpen, #fileSave { font-size:14px; font-weight:700; border:1.5px solid var(--accent); color:var(--accent); background:none;
                         border-radius:99px; padding:5px 14px; text-decoration:none; }
  #fileClose { border:none; background:none; color:var(--sub); padding:4px 6px; }
</style>
</head>
<body>
<header>
  <h1>学校の連絡まとめ</h1>
  <button id="refresh">更新</button>
</header>
<div id="newPage"><a id="newPageLink" target="_blank">スマホ用の画面を開く（Google でログイン・ホーム画面に追加できます）</a></div>
<div class="tabs" id="tabs">
  <button data-f="all" class="on">すべて</button>
  <button data-f="unread">未読</button>
  <button data-f="sakura">さくらdays</button>
  <button data-f="codmon">コドモン</button>
  <button data-f="tetoru">tetoru</button>
</div>
<div class="tabs" id="kidTabs"></div>
<div class="bulkbar"><button id="bulk">表示中をすべて済にする</button></div>
<div id="login" style="display:none;text-align:center;padding:24px 0">
  <p>はじめに Google でログインしてください（この端末で 1 回だけ）</p>
  <div id="loginBtn" style="display:inline-block"></div>
  <p id="loginMsg" style="color:#dc2626;font-size:13px"></p>
</div>
<div id="msg"></div>
<div id="list"></div>
<div id="fileBar">
  <span id="fileName"></span>
  <a id="fileOpen" target="_blank" rel="noopener">開く</a>
  <button id="fileSave">保存</button>
  <button id="fileClose" aria-label="閉じる">✕</button>
</div>
<script>
const $ = s => document.querySelector(s);
const SRC = { sakura: 'さくらdays', codmon: 'コドモン', tetoru: 'tetoru' };
let items = [], filter = 'all';
const opened = new Set();

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function linkify(s) { return esc(s).replace(/https?:\/\/[^\s<]+/g, u => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'); }

function shownItems() {
  return items.filter(it => filter === 'all' ? true : filter === 'unread' ? !it.read
    : filter.startsWith('kid:') ? (it.kids || []).includes(filter.slice(4)) : it.source === filter);
}


function renderKidTabs() {
  const kids = [];
  items.forEach(it => (it.kids || []).forEach(k => { if (!kids.includes(k)) kids.push(k); }));
  $('#kidTabs').innerHTML = kids.map(k => {
    const n = items.filter(it => !it.read && (it.kids || []).includes(k)).length;
    return '<button data-f="kid:' + esc(k) + '"' + (filter === 'kid:' + k ? ' class="on"' : '') + '>' + esc(k) + (n ? ' ' + n : '') + '</button>';
  }).join('');
}

function render(list) {
  if (list) items = list;
  const shown = shownItems();
  $('#list').innerHTML = shown.length ? shown.map(card).join('') : '<div class="empty">連絡はありません</div>';
  const unread = items.filter(it => !it.read).length;
  $('#tabs [data-f="unread"]').textContent = unread ? '未読 ' + unread : '未読';
  renderKidTabs();
  $('#bulk').style.visibility = shown.some(it => !it.read) ? 'visible' : 'hidden';
}

function card(it) {
  const files = it.files || [], links = it.links || [];
  const acts = files.map((f, i) => '<button data-file="' + i + '">📄 ' + esc(f.name) + '</button>')
    .concat(links.map(l => '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.name) + '</a>'));
  return '<div class="card' + (it.read ? ' done' : ' unread') + (opened.has(it.id) ? ' open' : '') + '" data-id="' + esc(it.id) + '">' +
    '<div class="row1"><input type="checkbox" class="chk" title="済にする"' + (it.read ? ' checked' : '') + '><div class="main">' +
    '<div class="top"><span class="badge src-' + esc(it.source) + '">' + esc(SRC[it.source] || it.source) + '</span>' +
    '<span class="from">' + esc(it.from) + '</span><span class="date">' + esc(it.date) + '</span></div>' +
    '<div class="title">' + esc(it.title) + (files.length ? ' <span class="clip">📎' + files.length + '</span>' : '') + '</div>' +
    '<div class="kids">' + (it.kids || []).map(k => '<span class="kid">' + esc(k) + '</span>').join('') + planTags(it) + '</div>' +
    '</div></div>' +
    '<div class="body">' + linkify(it.body) + (acts.length ? '<div class="acts">' + acts.join('') + '</div>' : '') + plansHtml(it) + '</div></div>';
}


function planTags(it) {
  const items = (it.plan && it.plan.items) || [], reg = it.registered || {};
  const left = items.map((p, i) => ({ p, i })).filter(x => !reg[x.i]);
  const ev = left.filter(x => x.p.kind === 'event').length, td = left.filter(x => x.p.kind === 'todo').length;
  if (ev || td) return (ev ? '<span class="ptag ev">📅 予定 ' + ev + '</span>' : '') + (td ? '<span class="ptag td">✅ やること ' + td + '</span>' : '');
  return items.length ? '<span class="ptag ok">登録済み</span>' : '';
}


function plansHtml(it) {
  const items = (it.plan && it.plan.items) || [], reg = it.registered || {};
  const head = '<h3>予定・やることの候補<button data-replan="1">' + (it.plan && !it.plan.skipped ? 'AI で読み直す' : 'AI で読む') + '</button></h3>';
  if (!it.plan || it.plan.skipped) return '<div class="plans">' + head + '<div class="note">' + (it.plan ? '古い連絡なので読んでいません' : 'まだ読んでいません（30 分以内に自動で読みます）') + '</div></div>';
  if (!items.length) return '<div class="plans">' + head + '<div class="note">登録が必要なものは見つかりませんでした</div></div>';
  return '<div class="plans">' + head + items.map((p, i) => '<div class="plan' + (reg[i] ? ' done' : '') + '" data-plan="' + i + '">' +
    '<div class="r"><button class="kind ' + esc(p.kind) + '" data-kind="' + esc(p.kind) + '">' + (p.kind === 'event' ? '📅 予定（FAMILY）' : '✅ やること（SCHOOL）') + '</button>' +
    (reg[i] ? '<span class="note">登録済み</span>' : '<button class="reg">登録</button>') + '</div>' +
    '<div class="r"><input class="t" value="' + esc(p.title) + '"></div>' +
    '<div class="r"><input class="d" type="date" value="' + esc(p.date) + '">' +
    '<input class="s" type="time" value="' + esc(p.start) + '"' + (p.kind === 'todo' ? ' style="display:none"' : '') + '>' +
    '<input class="e" type="time" value="' + esc(p.end) + '"' + (p.kind === 'todo' ? ' style="display:none"' : '') + '></div>' +
    (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') + '</div>').join('') + '</div>';
}


function setRead(ids, read) {
  items.forEach(it => { if (ids.includes(it.id)) it.read = read; });
  render();
  google.script.run.withFailureHandler(e => $('#msg').textContent = '記録できませんでした：' + e.message).setRead(ids, read);
}

function load(fn) {
  $('#msg').textContent = fn === 'refreshNow' ? '取り込み中…' : '読み込み中…';
  google.script.run.withSuccessHandler(list => { $('#msg').textContent = ''; render(list); })
    .withFailureHandler(e => $('#msg').textContent = 'エラー：' + e.message)[fn]();
}


let ready = null;
function openFile(id, index) {
  $('#fileBar').style.display = 'none';
  $('#msg').textContent = 'ファイルを取り出し中…';
  google.script.run.withSuccessHandler(f => {
    $('#msg').textContent = '';
    const bin = atob(f.b64), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const blob = new Blob([buf], { type: f.mime });
    if (ready) URL.revokeObjectURL(ready.url);
    ready = { name: f.name, blob, url: URL.createObjectURL(blob), file: new File([blob], f.name, { type: f.mime }) };
    $('#fileName').textContent = f.name;
    $('#fileOpen').href = ready.url;
    $('#fileBar').style.display = 'flex';
  }).withFailureHandler(e => $('#msg').textContent = 'エラー：' + e.message).getFile(id, index);
}

function saveReady() {
  if (!ready) return;
  
  if (navigator.canShare && navigator.share && navigator.canShare({ files: [ready.file] })) {
    navigator.share({ files: [ready.file] }).catch(() => {});
    return;
  }
  const a = document.createElement('a');
  a.href = ready.url; a.download = ready.name;
  document.body.appendChild(a); a.click(); a.remove();
}

['#tabs', '#kidTabs'].forEach(sel => $(sel).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.f === filter));
  render();
}));

$('#list').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  const id = c.dataset.id;
  if (e.target.classList.contains('chk')) { setRead([id], e.target.checked); return; }
  const fb = e.target.closest('[data-file]');
  if (fb) { openFile(id, Number(fb.dataset.file)); return; }
  const it = items.find(x => x.id === id);
  if (e.target.closest('[data-replan]')) {
    $('#msg').textContent = 'AI で読んでいます…';
    google.script.run.withSuccessHandler(plan => { $('#msg').textContent = ''; it.plan = plan; it.registered = {}; render(); })
      .withFailureHandler(err => $('#msg').textContent = 'エラー：' + err.message).replan(id);
    return;
  }
  const pl = e.target.closest('.plan');
  if (pl) {
    const i = Number(pl.dataset.plan), p = it.plan.items[i];
    const kb = e.target.closest('.kind');
    if (kb) {
      
      Object.assign(p, { title: pl.querySelector('.t').value, date: pl.querySelector('.d').value, start: pl.querySelector('.s').value, end: pl.querySelector('.e').value });
      p.kind = p.kind === 'event' ? 'todo' : 'event'; render(); return;
    }
    if (e.target.closest('.reg')) {
      const q = { kind: p.kind, title: pl.querySelector('.t').value.trim(), date: pl.querySelector('.d').value,
        start: pl.querySelector('.s').value, end: pl.querySelector('.e').value, note: p.note };
      if (!q.title) { $('#msg').textContent = '題名を入れてください'; return; }
      if (q.kind === 'event' && !q.date) { $('#msg').textContent = '予定の日付を入れてください'; return; }
      Object.assign(p, q);
      $('#msg').textContent = '登録中…';
      google.script.run.withSuccessHandler(reg => { $('#msg').textContent = (q.kind === 'event' ? 'カレンダー FAMILY' : 'ToDo SCHOOL') + ' に登録しました'; it.registered = reg; render(); })
        .withFailureHandler(err => $('#msg').textContent = 'エラー：' + err.message).registerPlan(id, i, q);
    }
    return;
  }
  if (e.target.closest('a')) return;
  if (opened.has(id)) opened.delete(id); else opened.add(id);
  c.classList.toggle('open');
});

$('#bulk').addEventListener('click', () => {
  const ids = shownItems().filter(it => !it.read).map(it => it.id);
  if (ids.length) setRead(ids, true);
});

$('#refresh').addEventListener('click', () => load('refreshNow'));
$('#fileSave').addEventListener('click', saveReady);
$('#fileClose').addEventListener('click', () => { $('#fileBar').style.display = 'none'; });

{ const c = window.HUB_CACHED && window.HUB_CACHED(); if (c) render(c); }
load('getItems');

if (!window.HUB_STATIC) google.script.run.withSuccessHandler(u => { $('#newPageLink').href = u; $('#newPage').style.display = 'block'; }).getNewPageUrl();
</script>
</body>
</html>
